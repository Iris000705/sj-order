<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Junior 代購下單系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }
        .order-container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section-title { font-size: 1.1rem; font-weight: bold; color: #333; margin-top: 25px; margin-bottom: 12px; border-bottom: 2px solid #0056b3; padding-bottom: 5px; }
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (max-width: 576px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        .btn-check:checked + .btn-outline-primary { background-color: #0056b3; color: white; border-color: #0056b3; }
        .btn-outline-primary { border-color: #dee2e6; color: #495057; background-color: #fff; transition: all 0.2s; font-size: 0.9rem; padding: 10px 5px; }
        .btn-outline-primary:hover { border-color: #0056b3; color: #0056b3; background-color: #f0f7ff; }
        .admin-panel { background: #fff3cd; border: 1px solid #ffeba2; padding: 20px; border-radius: 8px; margin-top: 30px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="order-container" id="userFormSection">
        <h3 class="text-center mb-4 font-weight-bold" style="color: #0056b3;">Super Junior 日本周邊代購填單</h3>
        
        <form id="orderForm">
            <div class="mb-3">
                <label class="form-label fw-bold">訂購人姓名</label>
                <input type="text" class="form-control" id="customerName" placeholder="請輸入您的姓名或暱稱" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">IG 帳號</label>
                <input type="text" class="form-control" id="instagramId" placeholder="請輸入您的 Instagram 帳號 (例如: sj_official)" required>
            </div>

            <div class="section-title">19糰 TWD680+成員ID證件照 TWD420(不拆可多成員)</div>
            <div class="product-grid" id="grid-19"></div>

            <div class="section-title">20糰 TWD780+成員四格照片TWD320(不拆可多成員)</div>
            <div class="product-grid" id="grid-20"></div>

            <div class="section-title">手燈套 TWD790</div>
            <div class="product-grid" id="grid-light"></div>

            <div class="section-title">杯套 TWD300</div>
            <div class="product-grid" id="grid-cup"></div>

            <div class="section-title">襯衫 TWD2100</div>
            <div class="product-grid" id="grid-shirt"></div>

            <div class="section-title">所有商品</div>
            <div class="product-grid" id="grid-others"></div>

            <button type="button" class="btn btn-primary w-100 py-2 mt-4 fw-bold" onclick="submitOrder()">確認送出訂單</button>
        </form>
    </div>

    <div class="order-container admin-panel" id="adminSection">
        <h4 class="text-warning-emphasis mb-3 fw-bold">🛠️ 代購訂單管理後台</h4>
        <p class="text-muted small">您目前是以管理員身份登入。點擊下方按鈕即可匯出所有訂單報表。</p>
        <a href="/api/export-excel" class="btn btn-warning fw-bold px-4 py-2">📥 匯出 Excel 訂單報表 (.csv)</a>
    </div>
</div>

<script>
    let allProducts = [];

    // 網頁載入時自動取得商品清單
    window.addEventListener('DOMContentLoaded', () => {
        // 檢查網址是否有管理員金鑰 (?admin=sj888)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'sj888') {
            document.getElementById('adminSection').style.display = 'block';
        }

        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                allProducts = products;
                renderGrids(products);
            })
            .catch(err => console.error("無法取得商品列表:", err));
    });

    // 根據商品名稱動態分類並渲染到對應的九宮格內
    function renderGrids(products) {
        const grid19 = document.getElementById('grid-19');
        const grid20 = document.getElementById('grid-20');
        const gridLight = document.getElementById('grid-light');
        const gridCup = document.getElementById('grid-cup');
        const gridShirt = document.getElementById('grid-shirt');
        const gridOthers = document.getElementById('grid-others');

        products.forEach(p => {
            const html = `
                <div>
                    <input type="checkbox" class="btn-check" id="btn-check-${p.id}" autocomplete="off" value="${p.id}">
                    <label class="btn btn-outline-primary w-100 d-flex flex-column align-items-center" for="btn-check-${p.id}">
                        <span class="fw-bold text-dark">${p.name.split('-')[1] || p.name}</span>
                        <span class="text-muted small mt-1">TWD ${p.price}</span>
                        <span class="badge ${p.stock > 0 ? 'bg-secondary' : 'bg-danger'} mt-1" style="font-size:0.7rem;">庫存: ${p.stock}</span>
                    </label>
                </div>
            `;

            // 精準模糊比對分類
            if (p.name.includes('19糰')) {
                grid19.insertAdjacentHTML('beforeend', html);
            } else if (p.name.includes('20糰')) {
                grid20.insertAdjacentHTML('beforeend', html);
            } else if (p.name.includes('手燈套')) {
                gridLight.insertAdjacentHTML('beforeend', html);
            } else if (p.name.includes('杯套')) {
                gridCup.insertAdjacentHTML('beforeend', html);
            } else if (p.name.includes('襯衫')) {
                gridShirt.insertAdjacentHTML('beforeend', html);
            } else {
                gridOthers.insertAdjacentHTML('beforeend', html);
            }
        });
    }

    // 處理送出訂單
    function submitOrder() {
        const customerName = document.getElementById('customerName').value.trim();
        const instagramId = document.getElementById('instagramId').value.trim();
        
        if (!customerName || !instagramId) {
            alert("請填寫完整的姓名與 IG 帳號！");
            return;
        }

        const checkedBoxes = document.querySelectorAll('.btn-check:checked');
        if (checkedBoxes.length === 0) {
            alert("請至少勾選一項商品再送出！");
            return;
        }

        const items = [];
        checkedBoxes.forEach(cb => {
            items.push({
                productId: parseInt(cb.value),
                quantity: 1 // 預設每按一個按鈕代表購買 1 個
            });
        });

        // 送出資料至後端 API
        fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customerName, instagramId, items })
        })
        .then(res => res.json())
        .then(resData => {
            if (resData.success) {
                alert(resData.message);
                location.reload(); // 下單成功後自動重整網頁重新整理庫存
            } else {
                alert("❌ 下單失敗：\n" + resData.message);
            }
        })
        .catch(err => {
            alert("系統連線發生錯誤，請稍後再試！");
            console.error(err);
        });
    }
</script>

</body>
</html>

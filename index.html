<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Junior 代購下單系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }
        .order-container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section-title { font-size: 1.2rem; font-weight: bold; color: #fff; background-color: #0056b3; margin-top: 25px; margin-bottom: 15px; padding: 10px; border-radius: 6px; }
        .product-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .btn-check:checked + .btn-outline-primary { background-color: #e6f0fa; color: #0056b3; border-color: #0056b3; border-width: 2px; }
        .btn-outline-primary { border-color: #dee2e6; color: #495057; background-color: #fff; transition: all 0.2s; font-size: 1rem; padding: 15px; text-align: left; border-radius: 8px; }
        .btn-outline-primary:hover { border-color: #0056b3; color: #0056b3; background-color: #f0f7ff; }
        .admin-panel { background: #fff3cd; border: 1px solid #ffeba2; padding: 20px; border-radius: 8px; margin-top: 30px; display: none; }
        .note-orange { color: #fd7e14; font-size: 0.9rem; font-weight: bold; margin-top: 2px; }
        
        /* 🚫 無庫存商品變灰色 */
        .btn-check:disabled + .btn-outline-primary {
            background-color: #e9ecef !important;
            border-color: #ced4da !important;
            color: #6c757d !important;
            cursor: not-allowed !important;
            opacity: 0.7;
        }

        /* 🔵 成員/款式選擇器容器 */
        .input-note-container {
            display: none;
            background: #fdfdfd;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 8px 8px;
            margin-top: -4px;
            margin-bottom: 5px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .has-note-open {
            border-radius: 8px 8px 0 0 !important;
        }

        /* 🔘 9位成員圓角按鈕排版 */
        .member-options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }
        .member-btn {
            border: 1px solid #ced4da;
            background-color: #fff;
            color: #495057;
            padding: 6px 0;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px; /* 膠囊圓圈造型 */
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .member-btn:hover {
            border-color: #0056b3;
            color: #0056b3;
            background-color: #f0f7ff;
        }
        /* 當點選成員按鈕後的 Super Junior 經典寶藍色高亮 */
        .member-btn.selected {
            background-color: #0056b3 !important;
            border-color: #0056b3 !important;
            color: #ffffff !important;
            box-shadow: 0 2px 6px rgba(0,86,179,0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="order-container" id="userFormSection">
        <h3 class="text-center mb-2 font-weight-bold" style="color: #0056b3;">Super Junior 超市周邊代購</h3>
        <p class="text-center text-danger small fw-bold mb-4">（⚠️ 請注意：最少需選購 3 個品項方可送出訂單）</p>
        
        <form id="orderForm" onsubmit="event.preventDefault(); submitOrder();">
            <div class="mb-3">
                <label class="form-label fw-bold">訂購人姓名</label>
                <input type="text" class="form-control" id="customerName" placeholder="請輸入您的姓名或暱稱" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">IG 帳號</label>
                <input type="text" class="form-control" id="instagramId" placeholder="請輸入您的 Instagram 帳號" required>
            </div>

            <div class="section-title text-center">所有商品</div>
            <div class="product-list" id="grid-others"></div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-4 fw-bold">確認送出訂單</button>
        </form>
    </div>

    <div class="order-container admin-panel" id="adminSection">
        <h4 class="text-warning-emphasis mb-3 fw-bold">🛠️ 代購訂單管理後台</h4>
        <p class="text-muted small">您目前是以管理員身份登入。點擊下方按鈕即可匯出所有訂單報表。</p>
        <a href="/api/export-excel" class="btn btn-warning fw-bold px-4 py-2">📥 匯出 Excel 訂單報表 (.csv)</a>
    </div>
</div>

<script>
    let allProducts = [];
    // 寶藍家族 9 位成員清單
    const sjMembers = ["利特", "希澈", "藝聲", "神童", "銀赫", "東海", "始源", "厲旭", "圭賢"];
    // 磁鐵 2 選 1 款式清單
    const magnetStyles = ["超市款", "SJ LOGO款"];

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'sj888') {
            document.getElementById('adminSection').style.display = 'block';
        }

        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                allProducts = products;
                renderGrids(products);
            })
            .catch(err => console.error("無法取得商品列表:", err));
    });

    // 🔒 秘密重置快捷鍵監聽 (Ctrl + Shift + R)
    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'r') {
            e.preventDefault();
            const pwd = prompt("🕵️‍♂️ 觸發系統資料重置模組\n請輸入後台管理密碼以清空所有訂單並還原庫存：");
            if (pwd === null) return;
            
            fetch('/api/reset-database', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.success) {
                    location.reload();
                }
            })
            .catch(err => alert("重置連線發生異常！"));
        }
    });

    function renderGrids(products) {
        const gridOthers = document.getElementById('grid-others');
        gridOthers.innerHTML = '';

        products.forEach(p => {
            let noteHtml = '';
            let inputFieldHtml = '';
            
            // 情況 A：需要選「成員」的品項
            if (p.name.includes('手燈套') || p.name.includes('20糰') || p.name.includes('抱枕') || p.name.includes('襯衫') || p.name.includes('COUPON SET')) {
                noteHtml = `<span class="note-orange">請選擇指定成員</span>`;
                
                let memberButtons = sjMembers.map(m => 
                    `<div class="member-btn" onclick="selectOption(${p.id}, '${m}', this)">${m}</div>`
                ).join('');

                inputFieldHtml = `
                    <div class="input-note-container" id="note-box-${p.id}">
                        <label class="small fw-bold text-primary mb-1">💙 請點選一位成員：</label>
                        <div class="member-options-grid">${memberButtons}</div>
                        <input type="hidden" id="note-input-${p.id}" value="">
                    </div>
                `;
            } 
            // 情況 B：需要選「款式」的品項 (磁鐵2選1)
            else if (p.name.includes('2選1')) {
                noteHtml = `<span class="note-orange">請選擇磁鐵款式</span>`;
                
                let styleButtons = magnetStyles.map(s => 
                    `<div class="member-btn" style="border-radius: 8px; padding: 8px 0;" onclick="selectOption(${p.id}, '${s}', this)">${s}</div>`
                ).join('');

                inputFieldHtml = `
                    <div class="input-note-container" id="note-box-${p.id}">
                        <label class="small fw-bold text-primary mb-1">🛒 請點選一款樣式：</label>
                        <div class="d-flex gap-2 mt-1">${styleButtons}</div>
                        <input type="hidden" id="note-input-${p.id}" value="">
                    </div>
                `;
            }

            const isDisabled = p.stock <= 0 ? 'disabled' : '';

            const html = `
                <div class="product-item-group">
                    <input type="checkbox" class="btn-check" id="btn-check-${p.id}" autocomplete="off" value="${p.id}" ${isDisabled} onchange="toggleNoteInput(${p.id})">
                    <label class="btn btn-outline-primary w-100 d-flex justify-content-between align-items-center" for="btn-check-${p.id}" id="label-${p.id}">
                        <div class="d-flex flex-column">
                            <span class="fw-bold text-dark" style="font-size:1.05rem;">${p.name}</span>
                            ${noteHtml}
                            <span class="text-muted small mt-1">TWD ${p.price}</span>
                        </div>
                        <span class="badge ${p.stock > 0 ? 'bg-secondary' : 'bg-danger'} p-2" style="font-size:0.8rem;">庫存: ${p.stock}</span>
                    </label>
                    ${inputFieldHtml}
                </div>
            `;
            gridOthers.insertAdjacentHTML('beforeend', html);
        });
    }

    // ✨ 新增：當點擊成員或款式按鈕時觸發的高亮與數值綁定邏輯
    function selectOption(productId, value, element) {
        // 先找到目前商品容器下所有的按鈕，把別人的高亮(selected)取消掉
        const parentBox = document.getElementById(`note-box-${productId}`);
        const allButtons = parentBox.querySelectorAll('.member-btn');
        allButtons.forEach(btn => btn.classList.remove('selected'));
        
        // 幫目前被點擊的按鈕加上高亮經典寶藍色
        element.classList.add('selected');
        
        // 將選中的名字填入隱藏的 input 中
        document.getElementById(`note-input-${productId}`).value = value;
    }

    function toggleNoteInput(productId) {
        const checkBox = document.getElementById(`btn-check-${productId}`);
        const noteBox = document.getElementById(`note-box-${productId}`);
        const noteInput = document.getElementById(`note-input-${productId}`);
        const label = document.getElementById(`label-${productId}`);

        if (!noteBox) return;

        if (checkBox.checked) {
            noteBox.style.display = 'block';
            label.classList.add('has-note-open');
        } else {
            noteBox.style.display = 'none';
            noteInput.value = ''; // 取消勾選時清空資料
            label.classList.remove('has-note-open');
            // 同時取消所有子按鈕的高亮狀態
            const allButtons = noteBox.querySelectorAll('.member-btn');
            allButtons.forEach(btn => btn.classList.remove('selected'));
        }
    }

    function submitOrder() {
        const customerName = document.getElementById('customerName').value.trim();
        const instagramId = document.getElementById('instagramId').value.trim();
        
        if (!customerName || !instagramId) {
            alert("請填寫完整的姓名與 IG 帳號！");
            return;
        }

        const checkedBoxes = document.querySelectorAll('.btn-check:checked');
        if (checkedBoxes.length < 3) {
            alert("❌ 下單失敗：限制每筆訂單最少需勾選 3 個商品品項！");
            return;
        }

        const items = [];
        let missingNote = false;
        let missingNoteProductName = "";

        checkedBoxes.forEach(cb => {
            const pId = parseInt(cb.value);
            const noteInput = document.getElementById(`note-input-${pId}`);
            let noteValue = '';

            if (noteInput) {
                noteValue = noteInput.value.trim();
                if (!noteValue) {
                    missingNote = true;
                    // 抓取商品名稱方便提示粉絲哪一項沒選
                    const label = document.getElementById(`label-${pId}`);
                    missingNoteProductName = label.querySelector('.fw-bold').innerText;
                }
            }

            items.push({
                productId: pId,
                quantity: 1,
                note: noteValue
            });
        });

        if (missingNote) {
            alert(`❌ 下單失敗：\n您勾選了『${missingNoteProductName}』，但尚未點選指定的成員或款式！`);
            return;
        }

        fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customerName, instagramId, items })
        })
        .then(res => res.json())
        .then(resData => {
            if (resData.success) {
                alert(resData.message);
                location.reload();
            } else {
                alert("❌ 下單失敗：\n" + resData.message);
            }
        })
        .catch(err => console.error(err));
    }
</script>

</body>
</html>
